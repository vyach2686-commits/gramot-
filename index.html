<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Грамотей 10+</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff;min-height:100vh}
button{font:inherit;cursor:pointer}.app{max-width:1100px;margin:auto;padding:20px}
.screen{display:none;animation:fade .35s ease}.screen.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:rgba(16,29,49,.92);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;box-shadow:0 20px 60px #0008}
.hero{padding:0;overflow:hidden}.heroImg{width:100%;display:block;max-height:440px;object-fit:cover}
.title{text-align:center;font-size:clamp(38px,7vw,72px);margin:22px 0 8px;color:#ffd447;text-shadow:0 4px 0 #8a4b00}
.subtitle{text-align:center;color:#cbd5e1;font-size:19px}.startBtn{display:block;margin:28px auto 10px;padding:18px 46px;border:0;border-radius:18px;background:linear-gradient(135deg,#ffcc33,#ff8a00);color:#231500;font-weight:900;font-size:22px}
.credits{text-align:center;color:#94a3b8;font-size:13px;margin-top:20px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.badge{padding:9px 14px;border-radius:14px;background:#1769aa;font-weight:800}.progress{height:10px;background:#17263b;border-radius:20px;overflow:hidden;margin-bottom:20px}.bar{height:100%;width:0;background:linear-gradient(90deg,#00d4ff,#7c5cff);transition:.3s}
.visual{border-radius:22px;overflow:hidden;margin-bottom:20px;background:#0d1a2d}.visual img{width:100%;height:260px;object-fit:cover;display:block}
.question{font-size:clamp(23px,4vw,34px);line-height:1.2;margin:15px 0 22px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{padding:18px;border:1px solid #31506e;background:#12253d;color:#fff;border-radius:16px;text-align:left;font-weight:700;transition:.2s}.answer:hover{transform:translateY(-2px);background:#173451}.answer.correct{background:#126b4a;border-color:#34d399}.answer.wrong{background:#762d39;border-color:#fb7185}.answer:disabled{cursor:default}
.rest{text-align:center}.cat{width:100%;border-radius:25px;display:block;margin-bottom:20px}.fact{font-size:21px;line-height:1.5;color:#e2e8f0}.continue{margin-top:22px;padding:15px 32px;border:0;border-radius:15px;background:#22c55e;color:#04150b;font-weight:900}
.result{text-align:center}.score{font-size:70px;font-weight:900;color:#ffd447}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{padding:18px;background:#0c1c31;border-radius:18px}.stat b{display:block;font-size:28px;color:#7dd3fc}.again{padding:16px 35px;border:0;border-radius:15px;background:#ffb703;font-weight:900}
@media(max-width:700px){.answers,.stats{grid-template-columns:1fr}.card{padding:18px}.visual img{height:190px}.top{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<section id="start" class="screen active">
 <div class="card hero">
  <img id="heroImg" class="heroImg">
  <h1 class="title">Грамотей 10+</h1>
  <p class="subtitle">Умная игра для тех, кто любит узнавать новое</p>
  <button class="startBtn" onclick="startGame()">НАЧАТЬ ИГРУ</button>
  <div class="credits">Автор и разработчик: Вячеслав · ИИ-помощник: Джарвис · © 2026 Вячеслав</div>
 </div>
</section>

<section id="game" class="screen">
 <div class="card">
  <div class="top"><span id="subject" class="badge"></span><span id="counter"></span></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div class="visual"><img id="questionImg"></div>
  <div id="question" class="question"></div>
  <div id="answers" class="answers"></div>
 </div>
</section>

<section id="rest" class="screen">
 <div class="card rest">
  <h1 id="restTitle">Отличная работа!</h1>
  <img id="restImg" class="cat">
  <div class="fact" id="fact"></div>
  <button class="continue" onclick="continueGame()">ПРОДОЛЖИТЬ</button>
 </div>
</section>

<section id="result" class="screen">
 <div class="card result">
  <h1>Игра завершена</h1><div class="score" id="score"></div>
  <div class="stats"><div class="stat"><b id="correct"></b>правильных</div><div class="stat"><b id="total"></b>вопросов</div><div class="stat"><b id="streak"></b>макс. серия</div><div class="stat"><b id="stars"></b>звёзд</div></div>
  <div id="subjects"></div>
  <button class="again" onclick="startGame()">ИГРАТЬ ЕЩЁ</button>
 </div>
</section>
</div>

 });
 if(chosen.length<20){
   let extra=shuffle(questions.filter(x=>!chosen.some(y=>y.id===x.id)&&!used.includes(x.id))).slice(0,20-chosen.length);
   chosen.push(...extra);
 }
 game=shuffle(chosen);index=0;score=0;correct=0;streak=0;maxStreak=0;
 subjectStats={"Русский язык":[0,0],"Математика":[0,0],"История России":[0,0],"География":[0,0]};
 show("game");renderQuestion();
}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function renderQuestion(){
 const q=game[index];
 $("subject").textContent=q.subject;
 $("counter").textContent=`Вопрос ${index+1} из ${game.length}`;
 $("bar").style.width=((index)/game.length*100)+"%";
 $("question").textContent=q.q;
 $("questionImg").src=q.image;
 $("questionImg").style.objectPosition = subjectPosition(q.subject,index);
 const answers=shuffle(q.choices);
 $("answers").innerHTML="";
 answers.forEach(a=>{
   const b=document.createElement("button");b.className="answer";b.textContent=a;
   b.onclick=()=>checkAnswer(b,a,q);$("answers").appendChild(b);
 });
}
function subjectPosition(s,i){
 if(s==="Математика") return "center 15%";
 if(s==="Русский язык") return "right 12%";
 if(s==="История России") return "left 55%";
 return "center 75%";
}
function checkAnswer(btn,a,q){
 document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
 const ok=a===q.answer;
 if(ok){btn.classList.add("correct");correct++;score+=10;streak++;maxStreak=Math.max(maxStreak,streak);subjectStats[q.subject][0]++;if(streak>=3)score+=5}
 else{btn.classList.add("wrong");streak=0;document.querySelectorAll(".answer").forEach(x=>{if(x.textContent===q.answer)x.classList.add("correct")})}
 subjectStats[q.subject][1]++;
 setTimeout(()=>{
   if(index%5===4){showRest(q.subject)} else {index++;renderQuestion()}
 },650);
}
function showRest(subject){
 const n=index+1;
 $("restTitle").textContent=n===15?"Финиш уже близко!":"Отличная работа! Отдых после "+n+" вопросов";
 $("restImg").src=IMAGE_POOL.cat;
 $("restImg").style.objectPosition="left bottom";
 const arr=facts[subject]||facts["Русский язык"];
 $("fact").innerHTML=`<b>Факт от Барсика:</b><br>${arr[Math.floor(Math.random()*arr.length)]}`;
 show("rest");
}
function continueGame(){
 index++;
 if(index>=game.length){finishGame();return}
 renderQuestion();show("game");
}
function finishGame(){
 game.forEach(q=>{if(!used.includes(q.id))used.push(q.id)});saveUsed();
 $("score").textContent=score;
 $("correct").textContent=correct;
 $("total").textContent=game.length;
 $("streak").textContent=maxStreak;
 $("stars").textContent="★".repeat(Math.max(1,Math.min(5,Math.floor(correct/4))));
 $("subjects").innerHTML=Object.entries(subjectStats).map(([s,v])=>`<p><b>${s}</b>: ${v[0]} / ${v[1]}</p>`).join("");
 show("result");
}
</script>
</body></html>
